# Hyperparameters for Unipen 1b (uppercase letters, 26 classes)
dataset: unipen_1b
num_classes: 26
seq_len: 50

# Gradient-based baseline attacks
eps: 0.1
eps_iter: 0.001
nb_iter: 600

# Carlini-Wagner
cw_binary_search_steps: 5
cw_max_iterations: 200
cw_learning_rate: 0.01
cw_confidence: 0.0

# AITE
aite_max_iter: 1000
aite_n_del: 1
aite_n_add: 1
